# SteamOS / Steam Deck + Windows release build.
#
# Trigger manually:   gh workflow run release-steamos.yml -f version=0.1.0
# (or Actions tab -> "Release (SteamOS + Windows)" -> Run workflow)
# Build only, no GitHub Release:   ... -f publish=false   (packages stay on the run)
#
# SteamOS: builds inside Valve's Steam Linux Runtime 3.0 "sniper" SDK so the
# binary runs on SteamOS, the Steam Linux runtime, and ordinary Linux desktops.
# Output is a tarball (doodle/bin/doodle + bundled SDL2/SDL3 + whisper-cli,
# models/ggml-base.en.bin, assets).
# Windows: an x64 build on windows-latest. Output is a zip with the same layout
# (doodle/bin/doodle.exe + SDL2.dll + whisper-cli.exe, models/, assets/).
# Both are attached to a GitHub Release tagged v<version>, each also under a
# fixed name (doodle-steamos.tar.gz, doodle-windows.zip) for .../releases/latest/download/.

name: Release (SteamOS + Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (tag becomes v<version>). Blank = date + commit."
        required: false
        default: ""
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        type: boolean
        default: false
      run_tests:
        description: "Run the model unit tests before building"
        type: boolean
        default: true
      publish:
        description: "Publish a GitHub Release (off = build only; packages stay as run artifacts)"
        type: boolean
        default: true

env:
  ODIN_TAG: dev-2026-11 # keep in step with the Odin you build with locally
  WHISPER_TAG: v1.9.5   # whisper.cpp release for speech-to-text
  WHISPER_MODEL: base.en
  WHISPER_MODEL_SHA256: a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002

jobs:
  # One version for every package (worked out once, so the builds can't disagree).
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Work out version
        id: ver
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then v="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v"    >> "$GITHUB_OUTPUT"

  build-steamos:
    needs: version
    runs-on: ubuntu-latest
    container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    defaults:
      run:
        shell: bash # the container's default `sh` is dash (no ${VAR::n})
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          apt-get update -qq
          apt-get install -y -qq patchelf curl make cmake git binutils
          # Odin links through `clang`; the SDK may only ship versioned names.
          if ! command -v clang >/dev/null; then
            ln -s "$(ls /usr/bin/clang-[0-9]* | sort -V | tail -1)" /usr/local/bin/clang
          fi
          clang --version

      - name: Install Odin ${{ env.ODIN_TAG }}
        run: |
          curl -fsSL -o /tmp/odin.tar.gz \
            "https://github.com/odin-lang/Odin/releases/download/${ODIN_TAG}/odin-linux-amd64-${ODIN_TAG}.tar.gz"
          mkdir -p /opt/odin
          tar -xzf /tmp/odin.tar.gz -C /opt/odin --strip-components=1
          echo "/opt/odin" >> "$GITHUB_PATH"
          ldd /opt/odin/odin || true
          /opt/odin/odin version
          # vendor:stb needs its static libs built on Linux.
          if ! ls /opt/odin/vendor/stb/lib/*.a >/dev/null 2>&1; then
            (cd /opt/odin/vendor/stb/src && sh ./build_stb.sh)
          fi

      - name: Test
        if: ${{ inputs.run_tests }}
        run: |
          odin test src/model
          odin test src/stt

      # ---- whisper.cpp (speech-to-text) ----
      - name: Fetch whisper.cpp ${{ env.WHISPER_TAG }}
        run: git clone -q --depth 1 --branch "$WHISPER_TAG" https://github.com/ggml-org/whisper.cpp.git /tmp/whisper.cpp

      - name: Cache whisper-cli
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: whisper-out/whisper-cli
          key: whisper-cli-${{ env.WHISPER_TAG }}-sniper-avx2-static-v1

      - name: Build whisper-cli
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          # Portable x86-64 build: NOT -march=native (the CI CPU may have AVX-512,
          # the Deck's Zen 2 doesn't). AVX2/FMA/F16C cover the Deck and most PCs
          # since ~2015. Static whisper/ggml + libstdc++, no OpenMP: one binary.
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build -DCMAKE_BUILD_TYPE=Release             -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF             -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON             -DGGML_AVX512=OFF -DGGML_OPENMP=OFF             -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build /tmp/whisper.cpp/build --target whisper-cli -j "$(nproc)"
          mkdir -p whisper-out
          cp /tmp/whisper.cpp/build/bin/whisper-cli whisper-out/
          strip whisper-out/whisper-cli

      - name: Cache model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: whisper-out/ggml-${{ env.WHISPER_MODEL }}.bin
          key: whisper-model-${{ env.WHISPER_MODEL }}-${{ env.WHISPER_MODEL_SHA256 }}

      - name: Download model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p whisper-out
          curl -fsSL -o "whisper-out/ggml-$WHISPER_MODEL.bin"             "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-$WHISPER_MODEL.bin"

      - name: Check whisper-cli
        run: |
          set -eu
          echo "$WHISPER_MODEL_SHA256  whisper-out/ggml-$WHISPER_MODEL.bin" | sha256sum -c -
          ldd whisper-out/whisper-cli
          # No AVX-512 (zmm registers) may sneak in, or it crashes on the Deck.
          if objdump -d whisper-out/whisper-cli | grep -q '%zmm'; then
            echo "whisper-cli uses AVX-512" >&2; exit 1
          fi
          # Real transcription with the exact model we ship.
          out="$(whisper-out/whisper-cli -m "whisper-out/ggml-$WHISPER_MODEL.bin"                  -f /tmp/whisper.cpp/samples/jfk.wav -nt -np -t 4 2>/dev/null)"
          echo "$out"
          echo "$out" | grep -qi "ask not what your country"

      - name: Build
        run: |
          mkdir -p bin
          odin build src/app -out:bin/doodle -o:speed -no-bounds-check

      - name: Package
        run: |
          set -eu
          pkg=dist/doodle
          mkdir -p "$pkg/bin"
          cp bin/doodle "$pkg/bin/"
          cp -r assets "$pkg/"
          # Bundle SDL2 next to the binary and point the loader at it.
          sdl="$(ldd bin/doodle | awk '/libSDL2/ {print $3}')"
          cp -L "$sdl" "$pkg/bin/"
          patchelf --set-rpath '$ORIGIN' "$pkg/bin/doodle"
          # The runtime's libSDL2 is sdl2-compat, which dlopen()s libSDL3.so.0:
          # bundle SDL3 too, and give the shim an $ORIGIN runpath so its
          # dlopen finds the bundled copy first.
          if grep -aq 'libSDL3.so.0' "$pkg/bin/libSDL2-2.0.so.0"; then
            sdl3="$(ldconfig -p | awk '/libSDL3\.so\.0 / {print $NF; exit}')"
            [ -n "$sdl3" ] || { echo "sdl2-compat needs libSDL3.so.0 but none found" >&2; exit 1; }
            cp -L "$sdl3" "$pkg/bin/libSDL3.so.0"
            patchelf --set-rpath '$ORIGIN' "$pkg/bin/libSDL2-2.0.so.0"
          fi
          # Speech-to-text: whisper-cli beside doodle, model in models/.
          cp whisper-out/whisper-cli "$pkg/bin/"
          mkdir -p "$pkg/models" "$pkg/licenses"
          cp "whisper-out/ggml-$WHISPER_MODEL.bin" "$pkg/models/"
          cp /tmp/whisper.cpp/LICENSE "$pkg/licenses/whisper.cpp-LICENSE"
          readelf -d "$pkg/bin/doodle" | grep -E 'RUNPATH|NEEDED'
          ls -l "$pkg/bin" "$pkg/models"

      - name: Check bundled libraries load
        run: |
          # Load the bundled SDL2 and confirm every SDL library resolves from dist/.
          LD_DEBUG=libs python3 -c "import ctypes; ctypes.CDLL('dist/doodle/bin/libSDL2-2.0.so.0').SDL_GetVersion" 2> ld.log || true
          grep -E 'calling init: .*libSDL' ld.log
          if grep -E 'calling init: .*libSDL' ld.log | grep -v 'dist/doodle/bin/'; then
            echo "an SDL library was loaded from outside the package" >&2; exit 1
          fi
          # And the binary itself resolves SDL2 from its own folder.
          ldd dist/doodle/bin/doodle | grep SDL | tee /dev/stderr | grep -q 'dist/doodle/bin/'

      - name: Archive
        run: |
          echo "${{ needs.version.outputs.version }} (${GITHUB_SHA::7}, Odin ${ODIN_TAG}, whisper.cpp ${WHISPER_TAG} ${WHISPER_MODEL})" > dist/doodle/VERSION
          tar -czf "doodle-steamos-${{ needs.version.outputs.version }}.tar.gz" -C dist doodle

      - uses: actions/upload-artifact@v4
        with:
          name: doodle-steamos
          path: doodle-steamos-*.tar.gz
          if-no-files-found: error

  # ---- Windows (x64) ----
  build-windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin ${{ env.ODIN_TAG }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "$env:RUNNER_TEMP\odin.zip"
          Invoke-WebRequest -Uri "https://github.com/odin-lang/Odin/releases/download/$env:ODIN_TAG/odin-windows-amd64-$env:ODIN_TAG.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath C:\odin-dist
          # The zip may or may not have a top-level folder: use wherever odin.exe is.
          $odin = Get-ChildItem C:\odin-dist -Recurse -Filter odin.exe | Select-Object -First 1
          if (-not $odin) { throw "odin.exe not found in the Odin zip" }
          $odin.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $odin.FullName version

      - name: Test
        if: ${{ inputs.run_tests }}
        run: |
          odin test src/model
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          odin test src/stt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ---- whisper.cpp (speech-to-text) ----
      - name: Fetch whisper.cpp ${{ env.WHISPER_TAG }}
        run: git clone -q --depth 1 --branch "$env:WHISPER_TAG" https://github.com/ggml-org/whisper.cpp.git "$env:RUNNER_TEMP\whisper.cpp"

      - name: Cache whisper-cli
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: whisper-out/whisper-cli.exe
          key: whisper-cli-${{ env.WHISPER_TAG }}-win64-avx2-static-v2

      - name: Build whisper-cli
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          # Same portable x86-64 build as SteamOS: AVX2/FMA/F16C, no AVX-512, no
          # OpenMP. Static ggml/whisper and a static MSVC runtime: one .exe, no
          # VC++ redistributable needed. (CMAKE_MSVC_RUNTIME_LIBRARY only applies
          # under policy CMP0091, which whisper.cpp's cmake_minimum_required leaves OLD.)
          $src = "$env:RUNNER_TEMP\whisper.cpp"
          cmake -S $src -B "$src\build" -A x64 `
            -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF `
            -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON `
            -DGGML_AVX512=OFF -DGGML_OPENMP=OFF `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$src\build" --config Release --target whisper-cli -j $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force whisper-out | Out-Null
          Copy-Item "$src\build\bin\Release\whisper-cli.exe" whisper-out\

      - name: Cache model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: whisper-out/ggml-${{ env.WHISPER_MODEL }}.bin
          key: whisper-model-win-${{ env.WHISPER_MODEL }}-${{ env.WHISPER_MODEL_SHA256 }}

      - name: Download model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force whisper-out | Out-Null
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-$env:WHISPER_MODEL.bin" -OutFile "whisper-out\ggml-$env:WHISPER_MODEL.bin"

      - name: Check whisper-cli
        run: |
          $ErrorActionPreference = 'Stop'
          $hash = (Get-FileHash "whisper-out\ggml-$env:WHISPER_MODEL.bin" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:WHISPER_MODEL_SHA256) { throw "model checksum mismatch: $hash" }
          # Real transcription with the exact model we ship.
          $out = & whisper-out\whisper-cli.exe -m "whisper-out\ggml-$env:WHISPER_MODEL.bin" `
                   -f "$env:RUNNER_TEMP\whisper.cpp\samples\jfk.wav" -nt -np -t 4 2>$null
          $out
          if (-not ($out -match 'ask not what your country')) { throw "whisper-cli didn't transcribe the sample" }

      - name: Build
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          odin build src/app -out:bin/doodle.exe -o:speed -no-bounds-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = "dist\doodle"
          New-Item -ItemType Directory -Force "$pkg\bin", "$pkg\models", "$pkg\licenses" | Out-Null
          Copy-Item bin\doodle.exe "$pkg\bin\"
          # SDL2.dll from the Odin install we built against (build.bat does the same).
          $odinRoot = (odin root).Trim()
          Copy-Item (Join-Path $odinRoot "vendor\sdl2\SDL2.dll") "$pkg\bin\"
          Copy-Item -Recurse assets "$pkg\"
          # Speech-to-text: whisper-cli beside doodle, model in models\.
          Copy-Item whisper-out\whisper-cli.exe "$pkg\bin\"
          Copy-Item "whisper-out\ggml-$env:WHISPER_MODEL.bin" "$pkg\models\"
          Copy-Item "$env:RUNNER_TEMP\whisper.cpp\LICENSE" "$pkg\licenses\whisper.cpp-LICENSE"
          Get-ChildItem -Recurse "$pkg\bin", "$pkg\models" | Format-Table Name, Length

      - name: Check bundled DLLs
        run: |
          $ErrorActionPreference = 'Stop'
          # Every DLL doodle.exe / whisper-cli.exe import must be in the package or
          # part of Windows itself; never the VC++ runtime (users may not have it).
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin not found" }
          $bin = "dist\doodle\bin"
          $bad = @()
          foreach ($exe in "doodle.exe", "whisper-cli.exe") {
            $deps = & $dumpbin /nologo /dependents "$bin\$exe" | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim() }
            "$exe imports: $($deps -join ', ')"
            foreach ($d in $deps) {
              if ($d -match '^(vcruntime|msvcp)') { $bad += "$exe -> $d (VC++ runtime)"; continue }
              if (Test-Path "$bin\$d") { continue }
              if ($d -match '^api-ms-win-') { continue } # Windows API sets (UCRT is part of Windows 10+)
              if (Test-Path "$env:WINDIR\System32\$d") { continue }
              $bad += "$exe -> $d (missing)"
            }
          }
          if ($bad) { $bad; throw "unbundled DLL dependencies" }

      - name: Archive
        run: |
          $ErrorActionPreference = 'Stop'
          $v = "${{ needs.version.outputs.version }}"
          "$v ($($env:GITHUB_SHA.Substring(0, 7)), Odin $env:ODIN_TAG, whisper.cpp $env:WHISPER_TAG $env:WHISPER_MODEL, windows-x64)" | Out-File -Encoding utf8 dist\doodle\VERSION
          Compress-Archive -Path dist\doodle -DestinationPath "doodle-windows-$v.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: doodle-windows
          path: doodle-windows-*.zip
          if-no-files-found: error

  release:
    needs: [version, build-steamos, build-windows]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: doodle-*
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          flags=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then flags="--prerelease"; fi
          # Also attach fixed-name copies so .../releases/latest/download/doodle-steamos.tar.gz
          # and .../doodle-windows.zip always point at the newest release.
          steamos="$(ls doodle-steamos-*.tar.gz)"
          windows="$(ls doodle-windows-*.zip)"
          cp "$steamos" doodle-steamos.tar.gz
          cp "$windows" doodle-windows.zip
          gh release create "$TAG" "$steamos" doodle-steamos.tar.gz "$windows" doodle-windows.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Doodle $TAG" --generate-notes $flags
